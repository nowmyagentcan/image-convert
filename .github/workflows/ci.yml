name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  MACOSX_DEPLOYMENT_TARGET: '11.0'
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo test --locked
      - if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: target/raw-samples
          key: raw-samples-${{ hashFiles('tests/fixtures/fetch-raw.sh') }}
      - if: runner.os == 'Linux'
        name: Convert real RAW samples
        run: |
          sh tests/fixtures/fetch-raw.sh
          cargo test --locked --test decode real_raw_samples -- --ignored
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo fmt --check
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check licenses
      - name: vendor/libwebp is upstream's v1.6.0 tag
        run: |
          tag=$(git ls-remote https://github.com/webmproject/libwebp.git 'refs/tags/v1.6.0^{}' | cut -f1)
          [ "$(git rev-parse HEAD:vendor/libwebp)" = "$tag" ]
