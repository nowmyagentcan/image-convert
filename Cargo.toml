[package]
name = "image-convert"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Convert HEIC, AVIF, JPEG XL, SVG, TIFF and camera RAW images to PNG, JPEG or WebP"
repository = "https://github.com/nowmyagentcan/image-convert"
publish = false

[dependencies]
fast_image_resize = "6.1.0"
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "bmp", "ico", "webp"] }
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
jxl-oxide = { version = "0.12.6", default-features = false, features = ["moxcms"] }
moxcms = "0.9.1"
resvg = { version = "0.49.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
tiff = "0.11.3"
zune-jpeg = "0.5.15"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Imaging", "Win32_Media_MediaFoundation", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFCGTypes", "CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "CGImageSource", "objc2-core-graphics"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
cc = "1.10.0"

[dev-dependencies]
gif = "0.14.2"
png = "0.18.1"
