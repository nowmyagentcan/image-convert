[package]
name = "image-convert"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Convert HEIC, AVIF, JPEG XL, SVG, TIFF and camera RAW images to PNG, JPEG or WebP"
repository = "https://github.com/nowmyagentcan/image-convert"
publish = false

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
fast_image_resize = "6.1.0"
flate2 = "1.1.10"
imagesize = "0.15.0"
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "bmp", "ico", "webp"] }
jpeg-decoder = { version = "0.3.2", default-features = false }
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
jxl-oxide = { version = "0.12.6", default-features = false, features = ["moxcms"] }
moxcms = "0.9.1"
rmcp = { version = "3.8.0", default-features = false, features = ["server", "macros", "transport-io", "schemars"] }
resvg = { version = "0.49.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
simplecss = "0.2.2"
tiff = "0.11.3"
tokio = { version = "1.54.1", features = ["rt"] }
zune-jpeg = "0.5.15"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_Graphics_Imaging", "Win32_Media_MediaFoundation", "Win32_System_Com_StructuredStorage", "Win32_System_Console", "Win32_System_Variant", "Win32_UI_HiDpi", "Win32_UI_Shell"] }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFCGTypes", "CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "CGImageSource", "objc2-core-graphics"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
cc = "1.10.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
gif = "0.14.2"
png = "0.18.1"

# tests/speed.rs reads child processes' peak memory.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = ["Win32_System_ProcessStatus"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2.191"
