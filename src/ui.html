<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Convert images</title>

<style>
:root { --bg:#fafaf9; --fg:#1c1b1a; --muted:#6b6966; --line:#e7e5e2; --field:#f2f1ef; --accent:#0f7b4a; --danger:#b42318; --r:8px; }
@media (prefers-color-scheme: dark) { :root { --bg:#121110; --fg:#ecebe9; --muted:#9a9894; --line:#2a2826; --field:#1b1a19; --accent:#5fd38d; --danger:#f97066; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 24px 16px 16px; display: grid; gap: 14px; }
h1 { margin: 0; font-size: 19px; font-weight: 600; text-align: center; letter-spacing: -0.01em; }
p, h2 { margin: 0; }
svg { width: 16px; height: 16px; fill: currentColor; flex: none; }
.visual { width: auto; height: 64px; justify-self: center; color: var(--muted); }
form { display: grid; gap: 12px; }
#zone { display: grid; gap: 2px; place-content: center; min-height: 96px; padding: 16px; font: inherit; color: var(--fg); text-align: center;
  white-space: normal; background: none; border: 2px dashed var(--line); border-radius: var(--r); cursor: pointer; }
#zone:hover, #zone.over { border-color: var(--accent); background: var(--field); }
#chosen { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.row { display: flex; flex-wrap: wrap; gap: 8px 20px; }
.row label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.opts label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
input, select { width: 100%; min-height: 40px; padding: 8px 10px; font: inherit; font-size: 15px; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: var(--r); }
.row select { width: auto; }
.opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 10px; }
.opts .check { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--fg); }
.check input { width: 18px; min-height: 18px; accent-color: var(--accent); }
summary { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); cursor: pointer; list-style: none; border-radius: var(--r); }
summary::-webkit-details-marker { display: none; }
details[open] summary svg { transform: rotate(90deg); }
button { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 10px; font: inherit; font-size: 14px; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; white-space: nowrap; }
button:active { transform: translateY(1px); }
.go { justify-self: center; min-height: 40px; padding: 8px 40px; font-size: 15px; font-weight: 600; color: var(--bg); background: var(--accent); border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#out { display: grid; gap: 14px; min-height: 72px; padding: 16px; border: 1px solid var(--line); border-radius: var(--r); align-content: start; }
.muted { color: var(--muted); }
.bar { width: 100%; height: 3px; overflow: hidden; border-radius: var(--r); }
.bar::after { content: ""; display: block; width: 40%; height: 100%; background: var(--accent); animation: slide 1.1s linear infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
@media (prefers-reduced-motion: reduce) { .bar::after { width: 100%; animation: none; } }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; }
.sum { font-size: 17px; font-weight: 600; }
.file { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: start; padding-top: 14px; border-top: 1px solid var(--line); }
.thumb { display: grid; place-items: center; width: 64px; height: 64px; object-fit: contain; background: var(--field); border-radius: var(--r); }
.thumb svg { width: 24px; height: 24px; color: var(--danger); }
.text { display: grid; gap: 4px; min-width: 0; }
h2 { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.meta { font-size: 13px; color: var(--muted); }
.warn, .err { display: flex; gap: 8px; align-items: baseline; font-size: 14px; }
.warn svg, .err svg { position: relative; top: 3px; }
.err { color: var(--danger); font-weight: 600; }
.hint { padding-left: 24px; font-size: 14px; overflow-wrap: anywhere; }
a { color: inherit; }
footer { display: flex; justify-content: center; align-items: center; gap: 16px; font-size: 13px; }
footer a { display: inline-flex; color: var(--muted); border-radius: 4px; }
footer a:hover { color: var(--fg); }
footer svg { width: 18px; height: 18px; }
@media (max-width: 520px) { .opts { grid-template-columns: 1fr 1fr; } .file { grid-template-columns: 48px 1fr; } .thumb { width: 48px; height: 48px; } .file > button { grid-column: 2; justify-self: start; } }
</style>

    <path transform="translate(112 16) scale(.125)" d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z"/>
    <path transform="translate(156 8) scale(.1875)" d="M120,144H104a8,8,0,0,0-8,8v56a8,8,0,0,0,16,0v-8h8a28,28,0,0,0,0-56Zm0,40h-8V160h8a12,12,0,0,1,0,24Zm96,0v16.87a8,8,0,0,1-2.22,5.53A30.06,30.06,0,0,1,192,216c-17.65,0-32-16.15-32-36s14.35-36,32-36a29.38,29.38,0,0,1,16.48,5.12,8,8,0,0,1-9,13.26A13.21,13.21,0,0,0,192,160c-8.82,0-16,9-16,20s7.18,20,16,20a13.63,13.63,0,0,0,8-2.71V192a8,8,0,0,1,0-16h8A8,8,0,0,1,216,184ZM80,152v38a26,26,0,0,1-52,0,8,8,0,0,1,16,0,10,10,0,0,0,20,0V152a8,8,0,0,1,16,0ZM213.66,82.34l-56-56A8,8,0,0,0,152,24H56A16,16,0,0,0,40,40v72a8,8,0,0,0,16,0V40h88V88a8,8,0,0,0,8,8h48v16a8,8,0,0,0,16,0V88A8,8,0,0,0,213.66,82.34ZM160,80V51.31L188.69,80Z"/>
  </svg>

  <form>
    <button type="button" id="zone" aria-describedby="chosen">
      <span>Drop images here, click to choose, or paste (<span id="key">Ctrl</span>+V)</span>
      <span id="chosen"></span>
    </button>
    <input type="file" id="files" multiple hidden accept=".png,.jpg,.jpeg,.jpe,.jfif,.gif,.bmp,.dib,.ico,.webp,.tif,.tiff,.jxl,.heic,.heif,.hif,.avif,.svg,.svgz,.emf,.emz,.wmf,.wmz,.cr2,.cr3,.nef,.arw,.dng,.raf,.rw2,.pef">
    <div class="row">
      <label>Format
        <select id="to">
          <option value="auto">Auto</option>
          <option value="png">PNG</option>
          <option value="jpeg">JPEG</option>
          <option value="webp">WebP</option>
        </select>
      </label>
      <label>Size
        <select id="fit">
          <option value="none">Original</option>
          <option value="vision">Fit for AI</option>
          <option value="vision-hd">Fit for AI, larger</option>
        </select>
      </label>
    </div>
    <details>
      <summary><svg viewBox="0 0 256 256" aria-hidden="true"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"/></svg>Options</summary>

        <label>Max size (KB)<input id="kb" type="number" min="1" max="1073741" placeholder="Any"></label>
        <label>Quality<input id="quality" type="number" min="1" max="100" value="85"></label>
        <label>Background<input id="bg" value="white" pattern="white|black|#[0-9a-fA-F]{6}" title="white, black or #rrggbb" autocomplete="off" spellcheck="false"></label>
        <label class="check"><input id="exif" type="checkbox">Keep photo info (EXIF)</label>

    </details>
    <button class="go">Convert</button>

<script>
const $ = s => document.querySelector(s);
const form = $("form"), zone = $("#zone"), input = $("#files"), out = $("#out");
const icon = d => `<svg viewBox="0 0 256 256" aria-hidden="true"><path d="${d}"/></svg>`;
const SAVE = icon("M224,144v64a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V144a8,8,0,0,1,16,0v56H208V144a8,8,0,0,1,16,0Zm-101.66,5.66a8,8,0,0,0,11.32,0l40-40a8,8,0,0,0-11.32-11.32L136,124.69V32a8,8,0,0,0-16,0v92.69L93.66,98.34a8,8,0,0,0-11.32,11.32Z");
const WARN = icon("M236.8,188.09,149.35,36.22h0a24.76,24.76,0,0,0-42.7,0L19.2,188.09a23.51,23.51,0,0,0,0,23.72A24.35,24.35,0,0,0,40.55,224h174.9a24.35,24.35,0,0,0,21.33-12.19A23.51,23.51,0,0,0,236.8,188.09ZM222.93,203.8a8.5,8.5,0,0,1-7.48,4.2H40.55a8.5,8.5,0,0,1-7.48-4.2,7.59,7.59,0,0,1,0-7.72L120.52,44.21a8.75,8.75,0,0,1,15,0l87.45,151.87A7.59,7.59,0,0,1,222.93,203.8ZM120,144V104a8,8,0,0,1,16,0v40a8,8,0,0,1-16,0Zm20,36a12,12,0,1,1-12-12A12,12,0,0,1,140,180Z");
const FAIL = icon("M165.66,101.66,139.31,128l26.35,26.34a8,8,0,0,1-11.32,11.32L128,139.31l-26.34,26.35a8,8,0,0,1-11.32-11.32L116.69,128,90.34,101.66a8,8,0,0,1,11.32-11.32L128,116.69l26.34-26.35a8,8,0,0,1,11.32,11.32ZM232,128A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z");
if (/Mac|iPhone|iPad/.test(navigator.userAgent)) $("#key").textContent = "Cmd";

// One upload to the server: {file, blob} on 200 and 422 alike; a file without `input` is a run-level error.
async function convert(file, options) {
  const r = await fetch("/api/convert", { method: "POST", headers: { "X-File-Name": encodeURIComponent(file.name), "X-Options": JSON.stringify(options) }, body: file });
  if (r.ok) return { file: JSON.parse(decodeURIComponent(r.headers.get("X-Result"))), blob: await r.blob() };
  return { file: await r.json(), blob: null };
}

// Names come from the user's files and messages from the server: textContent only, with controls and bidi marks shown by code point, as the CLI does.
const shown = s => s.replace(/[\0-\x08\x0a-\x1f\x7f-\x9f؜‎‏‪-‮⁦-⁩]/g, c => `<U+${c.charCodeAt(0).toString(16).toUpperCase().padStart(4, "0")}>`);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const button = (label, act) => { const b = el("button"); b.type = "button"; b.innerHTML = SAVE; b.append(label); b.dataset.act = act; return b; };
const bytes = n => n < 1000 ? `${n} bytes` : Math.round(n / 1e3) < 1000 ? `${Math.round(n / 1e3)} KB` : `${(n / 1e6).toFixed(1)} MB`;
const upright = s => s.orientation > 4 ? `${s.height}×${s.width}` : `${s.width}×${s.height}`;
const summary = (ok, failed) => ok + failed === 1 ? (ok ? "Converted" : "Couldn't convert this image") : `${ok} converted` + (failed ? ` · ${failed} failed` : "");

function failure(box, e) {
  const p = el("p", "err"); p.innerHTML = FAIL; p.append(el("span", null, shown(e.message)));
  box.append(p);
  if (!e.hint) return;
  // A missing-codec hint names a Microsoft Store page; that one link opens the Store app.
  const hint = el("p", "hint");
  hint.append(...e.hint.split(/(ms-windows-store:\/\/pdp\/\?ProductId=\w+)/).map((s, i) => { if (i % 2 === 0) return shown(s); const a = el("a", null, s); a.href = s; return a; }));
  box.append(hint);
}

function fileBlock({ file: f, blob }) {
  const box = el("article", "file"), text = el("div", "text");
  if (f.error) {
    const t = el("div", "thumb"); t.innerHTML = FAIL;
    text.append(el("h2", null, shown(f.input)));
    failure(text, f.error);
    box.append(t, text);
    return box;
  }
  const img = el("img", "thumb");
  img.src = URL.createObjectURL(blob); img.alt = `Preview of ${f.output}`;
  urls.push(img.src);
  text.append(el("h2", null, `${shown(f.input)} → ${shown(f.output)}`), el("p", "meta", [`${f.width}×${f.height}`, bytes(f.bytes), f.resized ? `from ${upright(f.source)}` : ""].filter(Boolean).join(" · ")));
  for (const w of f.warnings) { const p = el("p", "warn"); p.innerHTML = WARN; p.append(el("span", null, shown(w.message))); text.append(p); }
  const save = button("Save", "save"); save.dataset.url = img.src; save.dataset.name = f.output;
  box.append(img, text, save);
  return box;
}

// The server takes uploads up to 512 MiB, the CLI's own file limit.
const LIMIT = 512 * 2 ** 20;
const tooBig = file => ({ file: { input: file.name, output: null, input_format: null, source: null, warnings: [],
  error: { code: "too_large", message: "The file is larger than 512 MiB.", hint: "Shrink or split it first." } }, blob: null });

let chosen = [], latest = 0, pasted = 0, urls = [];

// Only what differs from the defaults is sent, so the server can still lower an unset quality to fit a size limit.
const DEFAULTS = { to: "auto", fit: "none", quality: 85, background: "white" };
function sent(opts) { return Object.fromEntries(Object.entries(opts).filter(([k, v]) => v && v !== DEFAULTS[k])); }

function choose(files) {
  if (!files.length) return;
  chosen = [...files];
  $("#chosen").textContent = shown(chosen.length === 1 ? chosen[0].name : `${chosen.length} files: ${chosen.slice(0, 2).map(f => f.name).join(", ")}${chosen.length > 2 ? ` and ${chosen.length - 2} more` : ""}`);
  form.requestSubmit();
}

form.addEventListener("submit", async ev => {
  ev.preventDefault();
  const run = ++latest;
  let ok = 0, failed = 0;
  out.removeAttribute("aria-busy");
  if (!chosen.length) {
    out.replaceChildren();
    failure(out, { message: "No image chosen.", hint: "Drop images above, click the box to choose them, or paste one." });
    return;
  }
  const opts = sent({ to: $("#to").value, fit: $("#fit").value, max_side: Number($("#side").value), max_bytes: $("#kb").value * 1000,
    quality: Number($("#quality").value), background: $("#bg").value.trim(), keep_exif: $("#exif").checked });
  urls.forEach(URL.revokeObjectURL); urls = [];
  const status = el("div", "head");
  out.replaceChildren(status);
  for (const [i, file] of chosen.entries()) {
    const wait = setTimeout(() => {
      if (run !== latest) return;
      out.setAttribute("aria-busy", "true");
      status.innerHTML = '<div class="bar" role="progressbar" aria-label="Converting"></div>';
      status.append(el("p", "muted", shown(`Converting ${i + 1} of ${chosen.length} · ${file.name}`)));
    }, 150);
    let r;
    try { r = file.size > LIMIT ? tooBig(file) : await convert(file, opts); }
    catch { r = { file: { error: { message: "Can't reach image-convert.", hint: "Start it again with: image-convert ui" } } }; }
    clearTimeout(wait);
    if (run !== latest) return;
    if (!("input" in r.file)) { out.removeAttribute("aria-busy"); out.replaceChildren(); failure(out, r.file.error); return; }
    r.file.error ? failed++ : ok++;
    out.append(fileBlock(r));
  }
  out.removeAttribute("aria-busy");
  status.replaceChildren(el("p", "sum", summary(ok, failed)));
  if (ok > 1) status.append(button("Save all", "all"));
});

const save = b => { const a = el("a"); a.href = b.dataset.url; a.download = b.dataset.name; a.click(); };
out.addEventListener("click", async ev => {
  const b = ev.target.closest("button");
  if (b?.dataset.act === "save") save(b);
  if (b?.dataset.act !== "all") return;
  // Browsers drop downloads started in the same instant, so they go one at a time.
  for (const s of out.querySelectorAll("[data-act=save]")) { save(s); await new Promise(r => setTimeout(r, 250)); }
});

zone.addEventListener("click", () => input.click());
input.addEventListener("change", () => { choose(input.files); input.value = ""; });
document.addEventListener("dragover", ev => { ev.preventDefault(); zone.classList.add("over"); });
document.addEventListener("dragleave", ev => { if (!ev.relatedTarget) zone.classList.remove("over"); });
document.addEventListener("drop", ev => { ev.preventDefault(); zone.classList.remove("over"); choose(ev.dataTransfer.files); });
document.addEventListener("paste", ev => {
  const images = [...ev.clipboardData.files].filter(f => f.type.startsWith("image/"));
  if (!images.length) return;
  ev.preventDefault();
  choose(images.map(f => new File([f], `pasted-image-${++pasted}.png`, { type: f.type })));
});
document.addEventListener("keydown", ev => {
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "o") { ev.preventDefault(); input.click(); }
  else if (ev.key === "Enter" && (document.activeElement === document.body || document.activeElement.tagName === "SELECT")) { ev.preventDefault(); form.requestSubmit(); }
});
</script>
